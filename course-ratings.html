<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Tyrrells Open – Course Ratings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/src/styles/legacy.css" />
</head>
<body>

  <nav>
    <div class="container nav-layout">
      <a href="index.html"><img src="/crest/tto-crest-right-gold-transparent.png" class="crest-logo" /></a>
      <h1>The Tyrrells Open</h1>

      <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="course-ratings.html" class="active">Course Ratings</a></li>
        <li><a href="year-in-review.html">Year in Review</a></li>
        <li><a href="shop.html">Shop</a></li>
      </ul>
    </div>
  </nav>

  <section class="page-hero">
    <div class="page-hero-overlay"></div>
    <div class="page-hero-content">
      <p class="page-hero-eyebrow">The Tyrrells Open</p>
      <h2 class="page-hero-title">Course Ratings</h2>
      <p class="page-hero-subtitle">Every course we've played, rated and reviewed.</p>
    </div>
  </section>

  <main class="container">
    <div id="course-summary-sections"></div>

    <div id="selected-course-panel"></div>
  </main>

  <script type="module" src="/src/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const summarySections = document.getElementById("course-summary-sections");
      if (!summarySections) return;

      const courses =
        typeof getAllCourses === "function"
          ? getAllCourses()
          : { tyrrellsWood: getCourseData("tyrrellsWood") };

      var currentlySelectedRow = null;

      function isRated(course) {
        return course.ratings && course.ratings.status === "rated";
      }

      function getScores(course) {
        if (!isRated(course)) return null;
        var holeScore = course.ratings.holeTierRatings.reduce(function (sum, value) {
          return sum + value;
        }, 0);
        var facilitiesScore = Object.values(course.ratings.facilityRatings).reduce(function (sum, value) {
          return sum + value;
        }, 0);
        return {
          hole: holeScore,
          holeMax: course.holeCount * 3,
          facilities: facilitiesScore,
          facilitiesMax: 46,
          overall: holeScore + facilitiesScore,
          overallMax: (course.holeCount * 3) + 46,
        };
      }

      function renderSubRatings(course) {
        var scores = getScores(course);
        var facilities = course.ratings.facilityRatings;
        var fields = scores ? [
          { label: "Hole Rating", value: scores.hole, max: scores.holeMax },
          { label: "Location – Ease of Access", value: facilities.locationEaseOfAccess, max: 9 },
          { label: "Value for Money", value: facilities.valueForMoney, max: 9 },
          { label: "Post Round Vibes", value: facilities.postRoundVibes, max: 9 },
          { label: "Clubhouse", value: facilities.clubhouse, max: 9 },
          { label: "Golf Facilities", value: facilities.golfFacilities, max: 9 },
          { label: "Course Planner", value: facilities.courseMap, max: 1 },
          { label: "Facilities Total", value: scores.facilities, max: scores.facilitiesMax },
          { label: "Total", value: scores.overall, max: scores.overallMax, total: true },
        ] : [{ label: "Status", value: "Unrated" }];

        var table = document.createElement("table");
        table.className = "cr-ratings-table";

        var caption = document.createElement("caption");
        caption.className = "cr-ratings-caption";
        caption.textContent = "Course Ratings";
        table.appendChild(caption);

        var thead = document.createElement("thead");
        var headerRow = document.createElement("tr");
        var th1 = document.createElement("th");
        th1.textContent = "Category";
        var th2 = document.createElement("th");
        th2.textContent = "Score";
        headerRow.appendChild(th1);
        headerRow.appendChild(th2);
        thead.appendChild(headerRow);
        table.appendChild(thead);

        var tbodyRatings = document.createElement("tbody");

        fields.forEach(function (field) {
          var tr = document.createElement("tr");
          if (field.total) {
            tr.className = "cr-total-row";
          }
          var tdLabel = document.createElement("td");
          tdLabel.textContent = field.label;
          tr.appendChild(tdLabel);

          var tdScore = document.createElement("td");
          tdScore.textContent = field.max === undefined
            ? field.value
            : field.value + " /" + field.max;
          tr.appendChild(tdScore);

          tbodyRatings.appendChild(tr);
        });

        table.appendChild(tbodyRatings);
        return table;
      }

      function renderHoleTierSummary(course) {
        var table = document.createElement("table");
        table.className = "cr-tier-summary-table";

        var caption = document.createElement("caption");
        caption.className = "cr-tier-summary-caption";
        caption.textContent = "Hole Tier Summary";
        table.appendChild(caption);

        var thead = document.createElement("thead");
        var headerRow = document.createElement("tr");
        var tierTh = document.createElement("th");
        tierTh.textContent = "Tier";
        headerRow.appendChild(tierTh);
        var holesTh = document.createElement("th");
        holesTh.textContent = "Holes";
        headerRow.appendChild(holesTh);
        var pointsTh = document.createElement("th");
        pointsTh.textContent = "Points";
        headerRow.appendChild(pointsTh);
        thead.appendChild(headerRow);
        table.appendChild(thead);

        var tbody = document.createElement("tbody");

        var tiers = [
          { value: 3, label: "Gravy" },
          { value: 2, label: "Good" },
          { value: 1, label: "Salt & Vinegar" },
          { value: 0, label: "Meh" },
          { value: -1, label: "Busy's Teeth" },
        ];

        tiers.forEach(function (tier) {
          var tr = document.createElement("tr");
          var tdLabel = document.createElement("td");
          tdLabel.textContent = tier.label;
          tr.appendChild(tdLabel);

          var tdHoles = document.createElement("td");
          var tdPoints = document.createElement("td");

          var holes = course.ratings.holeTierRatings.reduce(function (matches, value, index) {
            if (value === tier.value) matches.push(index + 1);
            return matches;
          }, []);
          tdHoles.textContent = holes.length ? holes.join(", ") : "\u2014";
          tdPoints.textContent = holes.length * tier.value;

          tr.appendChild(tdHoles);
          tr.appendChild(tdPoints);
          tbody.appendChild(tr);
        });

        var totalTr = document.createElement("tr");
        totalTr.className = "cr-tier-total-row";
        var tdTotalLabel = document.createElement("td");
        tdTotalLabel.textContent = "Total";
        totalTr.appendChild(tdTotalLabel);
        var tdTotalHoles = document.createElement("td");
        var tdTotalPoints = document.createElement("td");
        var scores = getScores(course);
        tdTotalHoles.textContent = isRated(course) ? course.holeCount + " holes" : "Unrated";
        tdTotalPoints.textContent = scores ? scores.hole + "/" + scores.holeMax : "TBC";
        totalTr.appendChild(tdTotalHoles);
        totalTr.appendChild(tdTotalPoints);
        tbody.appendChild(totalTr);

        table.appendChild(tbody);
        return table;
      }

      function makeSection(holeCount) {
        var heading = document.createElement("h3");
        heading.textContent = holeCount + " Hole Courses";
        summarySections.appendChild(heading);
        var wrapper = document.createElement("div");
        wrapper.className = "table-wrapper";
        wrapper.innerHTML = "<table><thead><tr><th>Course</th><th>Location</th><th>Par</th><th>Distance</th><th>Overall</th></tr></thead><tbody></tbody></table>";
        summarySections.appendChild(wrapper);
        return wrapper.querySelector("tbody");
      }

      var sectionBodies = { 18: makeSection(18), 9: makeSection(9) };

      function compareCoursesByOverall(a, b) {
        var aScores = getScores(a.course);
        var bScores = getScores(b.course);

        if (!aScores && bScores) return 1;
        if (aScores && !bScores) return -1;
        if (aScores && bScores && aScores.overall !== bScores.overall) {
          return bScores.overall - aScores.overall;
        }

        var nameComparison = a.course.name.localeCompare(b.course.name, "en", { sensitivity: "base" });
        return nameComparison || a.key.localeCompare(b.key, "en");
      }

      var courseEntries = Object.keys(courses || {}).map(function (key) {
        return { key: key, course: courses[key] };
      });
      var sortedCourseEntries = [18, 9].reduce(function (entries, holeCount) {
        return entries.concat(courseEntries.filter(function (entry) {
          return entry.course && entry.course.holeCount === holeCount;
        }).sort(compareCoursesByOverall));
      }, []);

      sortedCourseEntries.forEach(function (entry) {
        var key = entry.key;
        var course = entry.course;
        if (!course) return;

        var scores = getScores(course);
        var overall = scores ? scores.overall + "/" + scores.overallMax : "TBC";
        var summaryBody = sectionBodies[course.holeCount];
        if (!summaryBody) return;
        var totalIndex = Array.isArray(course.par) ? course.par.length - 1 : -1;
        var parTotal = totalIndex >= 0 ? course.par[totalIndex] : null;
        var distanceTotal = Array.isArray(course.distance) && totalIndex >= 0 ? course.distance[totalIndex] : null;

        var summaryRow = document.createElement("tr");
        summaryRow.className = "details-toggle";
        summaryRow.style.cursor = "pointer";
        summaryRow.dataset.courseKey = key;
        summaryRow.innerHTML =
          "<td>" + course.name + "</td>" +
          "<td>" + (course.location || "") + "</td>" +
          "<td>" + (parTotal || "TBC") + "</td>" +
          "<td>" + (distanceTotal ? distanceTotal + " yds" : "TBC") + "</td>" +
          "<td class=\"cr-overall\">" + overall + "</td>";
        summaryBody.appendChild(summaryRow);

        summaryRow.addEventListener("click", function () {
          var panel = document.getElementById("selected-course-panel");

          if (currentlySelectedRow === this) {
            this.classList.remove("selected");
            currentlySelectedRow = null;
            panel.innerHTML = "";
            return;
          }

          if (currentlySelectedRow) {
            currentlySelectedRow.classList.remove("selected");
          }
          this.classList.add("selected");
          currentlySelectedRow = this;

          panel.innerHTML = "";

          var topGrid = document.createElement("div");
          topGrid.className = "course-panel-top";

          var leftCol = document.createElement("div");
          leftCol.className = "course-panel-left";

          var heading = document.createElement("div");
          heading.className = "course-header-row";
          var h3 = document.createElement("h3");
          h3.textContent = course.name;
          heading.appendChild(h3);

          var overallEl = document.createElement("span");
          overallEl.className = "course-header-overall";
          var detailScores = getScores(course);
          overallEl.textContent = detailScores
            ? detailScores.overall + "/" + detailScores.overallMax
            : "Unrated";
          heading.appendChild(overallEl);
          leftCol.appendChild(heading);

          var photosDiv = document.createElement("div");
          photosDiv.className = "course-feature-photos";
          for (var pi = 0; pi < 4; pi++) {
            var placeholder = document.createElement("div");
            placeholder.className = "course-photo-placeholder";
            placeholder.textContent = "Photo " + (pi + 1);
            photosDiv.appendChild(placeholder);
          }
          leftCol.appendChild(photosDiv);

          var descDiv = document.createElement("div");
          descDiv.className = "course-feature-description";
          var descP = document.createElement("p");
          descP.textContent = course.description || "Description coming soon.";
          descDiv.appendChild(descP);
          leftCol.appendChild(descDiv);

          var link = document.createElement("a");
          link.className = "course-feature-link";
          if (course.website) {
            link.href = course.website;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Official Website \u2192";
            leftCol.appendChild(link);
          }

          var infoRow = document.createElement("div");
          infoRow.className = "course-info-row";

          var infoCard = document.createElement("div");
          infoCard.className = "course-info-card";
          var infoItems = [
            { label: "Location", value: course.location || "TBC" },
            { label: "Tee Played", value: course.teePlayed || "TBC" },
            { label: "Course Rating", value: course.courseRating ?? "TBC" },
            { label: "Slope Rating", value: course.slope ?? "TBC" },
          ];
          if (course.playedIn) {
            infoItems.push({ label: "Played In", value: course.playedIn.join(", ") });
          }
          infoItems.forEach(function (item) {
            var infoEl = document.createElement("div");
            infoEl.className = "course-info-item";
            var infoLabel = document.createElement("span");
            infoLabel.className = "course-info-label";
            infoLabel.textContent = item.label;
            var infoValue = document.createElement("span");
            infoValue.className = "course-info-value";
            infoValue.textContent = item.value;
            infoEl.appendChild(infoLabel);
            infoEl.appendChild(infoValue);
            infoCard.appendChild(infoEl);
          });
          infoRow.appendChild(infoCard);

          if (isRated(course)) infoRow.appendChild(renderHoleTierSummary(course));

          topGrid.appendChild(leftCol);

          var rightCol = document.createElement("div");
          rightCol.className = "course-panel-right";

          var subRatingsTable = renderSubRatings(course);
          rightCol.appendChild(subRatingsTable);

          topGrid.appendChild(rightCol);

          panel.appendChild(topGrid);

          panel.appendChild(infoRow);

          var hasScorecard = [course.distance, course.par, course.strokeIndex].some(function (values) {
            return Array.isArray(values) && values.some(function (value) { return value !== null && value !== undefined; });
          });
          if (!hasScorecard) {
            var scorecardTbc = document.createElement("p");
            scorecardTbc.className = "course-feature-description";
            scorecardTbc.textContent = "Scorecard information TBC.";
            panel.appendChild(scorecardTbc);
            panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
            return;
          }

          var scorecardTable = document.createElement("table");
          scorecardTable.className = "scorecard-table";

          var thead = document.createElement("thead");
          var headerRow = document.createElement("tr");
          headerRow.appendChild(document.createElement("th"));
          holeLabels.forEach(function (label) {
            var th = document.createElement("th");
            th.textContent = label;
            headerRow.appendChild(th);
          });
          thead.appendChild(headerRow);
          scorecardTable.appendChild(thead);

          var tbodyDetail = document.createElement("tbody");

          function addRow(label, values) {
            var tr = document.createElement("tr");
            var th = document.createElement("th");
            th.textContent = label;
            tr.appendChild(th);
            values.forEach(function (v) {
              var td = document.createElement("td");
              td.textContent = v ?? "";
              tr.appendChild(td);
            });
            tbodyDetail.appendChild(tr);
          }

          addRow("Distance (yds)", course.distance);
          addRow("Par", course.par);
          addRow(
            "Stroke Index",
            course.strokeIndex.map(function (v) { return v === null ? "" : v; })
          );

          var holeRatingRow = holeLabels.map(function (_, idx) {
            if (idx === 9 || idx === 19 || idx === 20) return "";
            var ratingIndex = idx < 9 ? idx : idx - 1;
            return course.ratings.holeTierRatings[ratingIndex] ?? "";
          });
          addRow("Hole Rating", holeRatingRow);

          scorecardTable.appendChild(tbodyDetail);
          var scorecardWrapper = document.createElement("div");
          scorecardWrapper.className = "table-wrapper";
          scorecardWrapper.appendChild(scorecardTable);
          panel.appendChild(scorecardWrapper);

          panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
      });
    });
  </script>

</body>
</html>
